name: Debug 7.2 dump (final)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone + PR
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git ow
          cd ow
          git fetch --depth 1 origin pull/23231/head:pr
          git checkout pr

      - name: Inject 7.2
        run: |
          cd ow
          cat > include/kernel-7.2 <<EOF
          LINUX_VERSION-7.2 = 7.2
          LINUX_HASH-7.2 = f9fef3d14c0df53819026f4be74459835c2a0b0dcbf5b5bbd9ea19f0829402b3
          EOF
          cp target/linux/generic/config-6.18 target/linux/generic/config-7.2
          sed -i 's/KERNEL_PATCHVER:=6.18/KERNEL_PATCHVER:=7.2/' target/linux/spacemit/Makefile
          cp target/linux/spacemit/config-6.18 target/linux/spacemit/config-7.2

      - name: Run the EXACT dump metadata.pl uses (stderr visible)
        run: |
          cd ow
          make -C target/linux dump > /tmp/dump.txt 2> /tmp/dumperr.txt || true
          echo "--- 成功 dump 的 target 列表 ---"
          grep "^Target: " /tmp/dump.txt | head -40
          echo "--- stderr 前 60 行（错误现形）---"
          head -60 /tmp/dumperr.txt
          echo "--- stderr 里的 spacemit 上下文 ---"
          grep -B5 -A10 -i spacemit /tmp/dumperr.txt | head -80
      - name: C+D defconfig probe
        run: |
          cd ow
          echo "CONFIG_TARGET_spacemit=y" > .config
          echo "CONFIG_TARGET_spacemit_k1=y" >> .config
          echo "CONFIG_TARGET_spacemit_k1_DEVICE_generic=y" >> .config
          make defconfig 2>&1 | tail -3
          echo "=== C. .config 里的 TARGET 行 ==="
          grep "CONFIG_TARGET" .config | head -20
          echo "=== D. .targetconfig 里的 spacemit/device ==="
          grep -ic spacemit tmp/.targetconfig 2>/dev/null || echo "no .targetconfig"
          grep -i "DEVICE_generic" tmp/.targetconfig 2>/dev/null | head -5 || true
