name: Build OpenWrt R2S (Linux 7.2 Stable - Original)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev

      - name: Clone OpenWrt and checkout PR
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git ow
          cd ow
          git fetch --depth 1 origin pull/23231/head:pr
          git checkout pr

      - name: Feeds (GitHub mirror + retry)
        run: |
          cd ow
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then ok=1; break; fi
            sleep 15
          done
          [ $ok -eq 1 ]
          ./scripts/feeds install -a

      - name: Inject Kernel 7.2 Support (Stable)
        run: |
          cd ow
          # 1. 强行注入 7.2 内核定义和官方 SHA256
          cat > include/kernel-7.2 <<EOF
          LINUX_VERSION-7.2 = 7.2
          LINUX_HASH-7.2 = f9fef3d14c0df53819026f4be74459835c2a0b0dcbf5b5bbd9ea19f0829402b3
          EOF
          
          # 2. 切换 Target 到 7.2
          sed -i 's/KERNEL_PATCHVER:=6.18/KERNEL_PATCHVER:=7.2/' target/linux/spacemit/Makefile
          cp target/linux/spacemit/config-6.18 target/linux/spacemit/config-7.2
          
          # 3. 极简补丁管理：
          # 7.2 主线已经包含了 K1 的核心驱动。我们只保留 R2S 的板级 DTS 和调频。
          # 删掉其他 130 多个“cherry-pick”回迁补丁，避免和 7.2 主线冲突。
          mkdir -p target/linux/spacemit/patches-7.2
          cp target/linux/spacemit/patches-6.18/*orangepi-r2s* target/linux/spacemit/patches-7.2/ 2>/dev/null || true
          cp target/linux/spacemit/patches-6.18/*cpu-scaling* target/linux/spacemit/patches-7.2/ 2>/dev/null || true
          cp target/linux/spacemit/patches-6.18/*opp* target/linux/spacemit/patches-7.2/ 2>/dev/null || true
          
          echo "📦 7.2 补丁清单 (已精简):"
          ls target/linux/spacemit/patches-7.2/

      - name: Config (Original Defaults)
        run: |
          cd ow
          echo "CONFIG_TARGET_spacemit=y" > .config
          echo "CONFIG_TARGET_spacemit_k1=y" >> .config
          echo "CONFIG_TARGET_spacemit_k1_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          # 不强制 ext4，不强制 eBPF，完全使用 PR 作者的默认配置 (squashfs/erofs)
          make defconfig

      - name: Download
        run: |
          cd ow
          make download -j8 V=s || make download -j1 V=s

      - name: Build
        run: |
          cd ow
          make -j4 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: r2s-linux7.2-original
          path: |
            ow/bin/targets/spacemit/k1/*sdcard.img.gz
            ow/bin/targets/spacemit/k1/*emmc.img.gz
            ow/bin/targets/spacemit/k1/*initramfs.itb
            ow/bin/targets/spacemit/k1/*sysupgrade.img.gz
          retention-days: 3
