name: Build OpenWrt R2S (ext4 + eBPF + Direct Boot Hack)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: false
        default: '23231'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev

      - name: Clone OpenWrt and checkout PR
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git ow
          cd ow
          git fetch --depth 1 origin pull/${{ github.event.inputs.pr_number }}/head:pr
          git checkout pr

      - name: Feeds (GitHub mirror + retry)
        run: |
          cd ow
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then ok=1; break; fi
            sleep 15
          done
          [ $ok -eq 1 ]
          ./scripts/feeds install -a

      - name: Config (ext4 + eBPF)
        run: |
          cd ow
          echo "CONFIG_TARGET_spacemit=y" > .config
          echo "CONFIG_TARGET_spacemit_k1=y" >> .config
          echo "CONFIG_TARGET_spacemit_k1_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          
          # 1. 强制 ext4 文件系统
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "# CONFIG_TARGET_ROOTFS_EROFS is not set" >> .config
          
          # 2. 开启 eBPF 核心支持
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          echo "CONFIG_BPF_JIT=y" >> .config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> .config
          echo "CONFIG_HAVE_EBPF_JIT=y" >> .config
          echo "CONFIG_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_PACKAGE_bpftool=y" >> .config
          
          make defconfig

      - name: Download
        run: |
          cd ow
          make download -j8 V=s || make download -j1 V=s

      - name: Build
        run: |
          cd ow
          make -j4 V=s

      - name: Hack emmc.img (Inject FSBL for direct dd boot)
        run: |
          cd ow/bin/targets/spacemit/k1/
          IMG="openwrt-spacemit-k1-generic-ext4-emmc.img"
          
          # 解压镜像
          gunzip ${IMG}.gz
          
          echo "🔥 Injecting FSBL and U-Boot into emmc.img header..."
          # 1. 注入 bootinfo (偏移 0)
          dd if=../../../../staging_dir/image/u-boot-spacemit_k1/bootinfo_emmc.bin of=${IMG} conv=notrunc
          # 2. 注入 FSBL (偏移 128k，完美避开 GPT 分区表)
          dd if=../../../../staging_dir/image/u-boot-spacemit_k1/FSBL.bin of=${IMG} bs=1k seek=128 conv=notrunc
          # 3. 注入 U-Boot (偏移 448k)
          dd if=../../../../staging_dir/image/u-boot-spacemit_k1/u-boot.itb of=${IMG} bs=1k seek=448 conv=notrunc
          
          # 重新压缩
          gzip ${IMG}
          echo "✅ Hack successful! This emmc.img can now be dd'd directly to eMMC user area and boot!"

      - name: Upload firmware and tools
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r2s-ultimate
          path: |
            ow/bin/targets/spacemit/k1/*sdcard.img.gz
            ow/bin/targets/spacemit/k1/*emmc.img.gz
            ow/bin/targets/spacemit/k1/*initramfs.itb
            ow/bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz
          retention-days: 7