name: Build OpenWrt R2S (Linux 7.0 experiment)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev jq

      - name: Clone OpenWrt and checkout PR
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git ow
          cd ow
          git fetch --depth 1 origin pull/23231/head:pr
          git checkout pr

      - name: Feeds (GitHub mirror + retry)
        run: |
          cd ow
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then ok=1; break; fi
            sleep 15
          done
          [ $ok -eq 1 ]
          ./scripts/feeds install -a

      - name: Prepare kernel 7.0 (stable or rc, auto hash)
        run: |
          cd ow
          KURL=https://cdn.kernel.org/pub/linux/kernel/v7.x
          if curl -fsSI $KURL/linux-7.0.tar.xz >/dev/null 2>&1; then
            echo "✅ linux-7.0 stable 已发布"
            if [ ! -f include/kernel-7.0 ]; then
              HASH=$(curl -fsSL $KURL/linux-7.0.tar.xz | sha256sum | awk '{print $1}')
              printf 'LINUX_VERSION-7.0 = 7.0\nLINUX_HASH-7.0 = %s\n' "$HASH" > include/kernel-7.0
            fi
          else
            echo "⚠️ stable 未发布，尝试最新 7.0-rc"
            RC=$(curl -fsS https://www.kernel.org/releases.json | jq -r '.releases[] | select(.version | test("^7\\.0-rc")) | .version' | head -n1)
            [ -n "$RC" ] || { echo "❌ 连 7.0-rc 都没有，等内核发布吧"; exit 1; }
            HASH=$(curl -fsSL $KURL/testing/linux-$RC.tar.xz | sha256sum | awk '{print $1}')
            printf 'LINUX_VERSION-7.0 = %s\nLINUX_HASH-7.0 = %s\n' "$RC" "$HASH" > include/kernel-7.0
          fi
          cat include/kernel-7.0

      - name: Switch spacemit target to 7.0 (curated patches)
        run: |
          cd ow
          sed -i 's/KERNEL_PATCHVER:=6.18/KERNEL_PATCHVER:=7.0/' target/linux/spacemit/Makefile
          cp target/linux/spacemit/config-6.18 target/linux/spacemit/config-7.0
          # 只保留“板级/本地”补丁，已进上游的回迁补丁全部丢弃
          mkdir -p target/linux/spacemit/patches-7.0
          for p in 0009 0020 0021 0058 0084 0085 0112 0121 0122 0123 0127 0132 0137; do
            cp target/linux/spacemit/patches-6.18/${p}-* target/linux/spacemit/patches-7.0/ 2>/dev/null || true
          done
          echo "📦 7.0 补丁清单："
          ls target/linux/spacemit/patches-7.0/

      - name: Config (ext4 + eBPF)
        run: |
          cd ow
          echo "CONFIG_TARGET_spacemit=y" > .config
          echo "CONFIG_TARGET_spacemit_k1=y" >> .config
          echo "CONFIG_TARGET_spacemit_k1_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "# CONFIG_TARGET_ROOTFS_EROFS is not set" >> .config
          echo "CONFIG_BPF_SYSCALL=y" >> .config
          echo "CONFIG_BPF_JIT=y" >> .config
          echo "CONFIG_DEBUG_INFO_BTF=y" >> .config
          make defconfig

      - name: Download
        run: |
          cd ow
          make download -j8 V=s || make download -j1 V=s

      - name: Build
        run: |
          cd ow
          make -j4 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: r2s-linux7.0-exp
          path: |
            ow/bin/targets/spacemit/k1/*sdcard.img.gz
            ow/bin/targets/spacemit/k1/*emmc.img.gz
            ow/bin/targets/spacemit/k1/*initramfs.itb
            ow/bin/targets/spacemit/k1/u-boot-spacemit_k1.tar.gz
          retention-days: 3
